name: CI/CD Order Service Hexagonal

on:
  push:
    branches:
      - main

jobs:
  # =====================================================================
  # JOB 1: CALIDAD Y TESTS (Continuous Integration)
  # =====================================================================
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pip install poetry==2.0.0
        
      - name: Sincronizar Lock
        run: poetry lock

      - name: Instalar Dependencias
        run: poetry install

      - name: Auditoría de Seguridad (pip-audit)
        run: poetry run pip-audit

      - name: Linter y Formato (Ruff)
        run: poetry run ruff check .

      - name: Análisis de Tipos (MyPy)
        run: poetry run mypy .

      - name: Tests E2E (Pytest)
        run: poetry run pytest

  # =====================================================================
  # JOB 2: CONSTRUCCIÓN (Continuous Deployment)
  # =====================================================================
  cd-pipeline:
    needs: ci-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Construir Imagen Docker
        run: docker build -t order-service:latest .