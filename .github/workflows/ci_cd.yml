name: CI/CD Order Service Hexagonal

on:
  push:
    branches:
      - main

jobs:
  # =====================================================================
  # JOB 1: CALIDAD Y TESTS (Continuous Integration)
  # =====================================================================
  ci-pipeline:
    runs-on: ubuntu-latest

    # Le inyectamos variables de entorno falsas al robot
    # para que Pydantic arranque felizmente durante las pruebas sin necesitar un archivo .env
    env:
      JWT_SECRET_KEY: "LlaveFalsaParaGitHubActions123!"
      ALGORITHM: "HS256"

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pip install poetry==2.0.0
        
      - name: Sincronizar Lock (Previene choques entre OS)
        run: poetry lock

      - name: Instalar Dependencias
        run: poetry install --no-root

      - name: Auditoría de Seguridad (pip-audit)
        run: poetry run pip-audit

      - name: Linter y Formato (Ruff)
        run: poetry run ruff check .

      - name: Análisis de Tipos (MyPy)
        run: poetry run mypy .

      # creamos la tabla 'orders' en la RAM del robot de GitHub
      - name: Migraciones de Base de Datos (Alembic)
        run: poetry run alembic upgrade head

      - name: Tests E2E y Coverage (Pytest)
        run: poetry run pytest -v --cov=app --cov-report=term

  # =====================================================================
  # JOB 2: CONSTRUCCIÓN (Continuous Deployment)
  # =====================================================================
  cd-pipeline:
    needs: ci-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Construir Imagen Docker
        run: docker build -t order-service-hexagonal:latest .